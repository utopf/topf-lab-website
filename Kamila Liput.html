<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Topf Lab</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
/* ===== BODY ===== */
body {
  margin: 0;
  font-family: "Georgia", "Times New Roman", serif;
  color: black;
  line-height: 1.8;
  background: white;   /* header stays white */
}

/* ===== HEADER ===== */
header {
  position: relative;
  height: 120px;          /* fixed banner height */
  padding: 0;
  background-color: white;
  background-image:
    linear-gradient(rgba(255,255,255,0.1), rgba(255,255,255,0.1)),
    url("banner1.png");
  background-size: contain;
  background-position: 5% 0%;
  background-repeat: no-repeat;
}

header h1 {
  position: absolute;
  top: 30px;
  left: 800px;
  margin: 0;
  font-family: "Georgia", serif;
  font-size: 2.2rem;
  letter-spacing: 1px;
  color: #035333;
}

/* ===== NAVIGATION ===== */
nav {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: #035333;
  padding: 0.6rem 2rem;
  }

nav a {
  color: white;
  text-decoration: none;
  margin-right: 1.5rem;
  font-weight: 500;
}

nav a:hover {
  text-decoration: underline;
}
main {
  background-color: rgb(244, 247, 237);
  padding: 1rem 1rem;
}

    /* Container for profile */
    .profile-container {
      display: flex;
      max-width: 1000px;
      margin: 1rem auto 3rem auto;
      gap: 2rem;
      padding: 1rem;
    }

    /* Left column: image */
    .profile-left {
    flex: 0 0 250px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
}
.profile-left h2 {
    margin: 0.5rem 0 0.2rem;
    color: #2c3e50;
    font-size: 1.5rem;
}

.profile-left .position {
    margin: 0;
    font-weight: bold;
    color: #555;
}

.profile-left .email {
    margin-top: 0.5rem;
    color: #035333;
    font-size: 0.95rem;
    word-break: break-word;
}

    .profile-left .member-image {
    width: 180px;
  height: 180px;
  border-radius: 50%;
  overflow: hidden;
  margin: 0 auto 0.75rem auto;
    }

    .profile-left .member-image img {
       width: 110%;                /* slight zoom out */
  height: 110%;
  object-fit: cover;
  object-position: 30% 160%;   /* adjust horizontal & vertical positioning */
    }

    /* Right column: info */
    .profile-right {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      background-color: white;
      padding: 2rem;
      border-radius: 0; /* no rounded edges */
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    /* Subsection titles */
    .profile-right h3 {
      margin-top: 0;
      margin-bottom: 0.5rem;
      color: #2c3e50;
    }

    .profile-right p {
      margin-top: 0;
      margin-bottom: 1rem;
    }

    /* Responsive: stack image above text */
    @media (max-width: 800px) {
      .profile-container {
        flex-direction: column;
        align-items: center;
      }
      .profile-left {
        margin-bottom: 2rem;
      }
      .profile-right {
        width: 100%;
      }
    }

    .timeline-dl {
  display: grid;
  grid-template-columns: 120px 1fr; /* first column fixed for years */
  gap: 0.5rem 1rem;                /* row-gap, column-gap */
}

.timeline-dl dt {
  font-weight: bold;
  color: #2c3e50;
}

.timeline-dl dd {
  margin: 0;
}

/* ===== FOOTER ===== */
footer {
  background-color: #035333;
  padding: 0.8rem 2rem;
  text-align: center;
  font-size: 0.9rem;
  color: white;
}
</style>

</head>

<body>

<header>
  <h1>Team</h1>
  </header>


<nav>
  <a href="index.html">Home</a>
  <a href="research.html">Research</a>
  <a href="team.html">Team</a>
  <a href="publication.html">Publications</a>
  <a href="join.html">Join us!</a>
  <a href="news.html">News</a>
  <a href="resources.html">Resources</a>
  <a href="contact.html">Contact</a>
</nav>

<main>

  <div class="profile-container">
    <!-- Left column: member image -->
    <div class="profile-left">
      <div class="member-image">
        <img src="Kamila.jpg" alt="Kamila">
    </div>
      <h2>Kamila Liput</h2>
  <p class="position">Postdoctoral researcher</p>
  <p class="email">kliput@ibb.waw.pl</p>
</div>

    <!-- Right column: member info -->
    <div class="profile-right">
      <section>
        
        <p></p>
      </section>

      <section>
        <h3>Education</h3>
        <dl class="timeline-dl">
            <dt>2020</dt>
            <dd>PhD, Institute of Genetics and Animal Biotechnology PAS, Poland</dd>
        
      </section>

      

      <section>
        
      </section>
    </div>
  </div>
  </main>
<footer>
  © Topf Lab
</footer>
</body>
</html>
